{% extends 'accounts/base.html' %}
{% block title %}Add User{% endblock %}
{% block content %}
<div class="card" style="max-width:560px">
  <h1>Add User</h1>
  <form method="post" class="stack">
    {% csrf_token %}
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Username</label>
    <input name="username" placeholder="optional — defaults from email">
    <div class="grid grid-2">
      <div><label>First name</label><input name="first_name"></div>
      <div><label>Last name</label><input name="last_name"></div>
    </div>
    <label>Password</label>
    <input type="password" name="password" required>
    <label>Role</label>
    <select name="role" required>
      <option value="DEVELOPER">Developer</option>
      <option value="PROJECT_MANAGER">Project Manager</option>
      <option value="ADMIN">Administrator</option>
    </select>
    <button class="btn" style="margin-top:16px">Create User</button>
    <a href="{% url 'user_list' %}" class="muted">Cancel</a>
  </form>
</div>
{% endblock %}
