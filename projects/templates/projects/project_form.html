{% extends 'accounts/base.html' %}
{% block title %}{% if project %}Edit{% else %}New{% endif %} Project{% endblock %}
{% block page_title %}{% if project %}Edit Project{% else %}Create Project{% endif %}{% endblock %}
{% block content %}
<div class="card">
  <form method="post" class="stack">
    {% csrf_token %}
    <label>Name</label>
    <input name="name" value="{{ project.name|default:'' }}" required>
    <label>Description</label>
    <textarea name="description">{{ project.description|default:'' }}</textarea>
    <div class="grid grid-2">
      <div><label>Start date</label><input type="date" name="start_date" value="{{ project.start_date|date:'Y-m-d'|default:'' }}" required></div>
      <div><label>Deadline</label><input type="date" name="deadline" value="{{ project.deadline|date:'Y-m-d'|default:'' }}" required></div>
      <div><label>Status</label>
        <select name="status">
          {% for v,l in project.Status.choices|default_if_none:"" %}{% endfor %}
          <option value="PLANNED" {% if project.status == 'PLANNED' %}selected{% endif %}>Planned</option>
          <option value="IN_PROGRESS" {% if project.status == 'IN_PROGRESS' %}selected{% endif %}>In Progress</option>
          <option value="COMPLETED" {% if project.status == 'COMPLETED' %}selected{% endif %}>Completed</option>
        </select></div>
      <div><label>Priority</label>
        <select name="priority">
          <option value="LOW" {% if project.priority == 'LOW' %}selected{% endif %}>Low</option>
          <option value="MEDIUM" {% if project.priority == 'MEDIUM' %}selected{% endif %}>Medium</option>
          <option value="HIGH" {% if project.priority == 'HIGH' %}selected{% endif %}>High</option>
          <option value="CRITICAL" {% if project.priority == 'CRITICAL' %}selected{% endif %}>Critical</option>
        </select></div>
    </div>
      <div class="form-actions">
      <button class="btn">{% if project %}Save Changes{% else %}Create Project{% endif %}</button>
      <a href="{% if project %}{% url 'project_detail' project.pk %}{% else %}{% url 'project_list' %}{% endif %}" class="muted">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
