{% extends 'accounts/base.html' %}
{% block title %}Edit Label{% endblock %}
{% block page_title %}Edit Label{% endblock %}
{% block content %}
<div class="card">
  <form method="post" class="stack">
    {% csrf_token %}
    <div class="grid grid-2">
      <div><label>Name</label><input name="name" value="{{ label.name }}" required></div>
      <div><label>Color</label><input type="color" name="color" value="{{ label.color }}" class="color-pick" style="width:100%"></div>
    </div>
    <div class="form-actions">
      <button class="btn">Save Changes</button>
      <a href="{% url 'label_list' %}" class="muted">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
